spring.application.name=dwese2627-ticket-logger-webapp-carlosmartinez
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}
# Indica cuál es el fichero de las variables de entorno
spring.config.import=optional:file:.env[.properties]

# Forzado a la inicialización del datasource con los archivos schema.sql y data.sql

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
# Internacionalización
spring.messages.basename=messages
spring.messages.encoding=UTF-8
