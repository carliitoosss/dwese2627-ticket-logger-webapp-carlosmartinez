
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Ticket Logger - Detalle de Región')}"></head>

<body class="d-flex flex-column min-vh-100">

<!-- Cabecera -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- Contenido principal -->
<main class="list-page content-wrapper">
    <div class="list-card">

        <!-- Título traducido -->
        <h1 th:text="#{msg.region-detail.title}">
            Detalle de la Comunidad Autónoma
        </h1>

        <!-- Mensaje de error -->
        <div th:if="${errorMessage}"
             class="alert alert-danger"
             th:text="${errorMessage}">
        </div>

        <!-- Datos de la región -->
        <div class="card mb-4">
            <div class="card-header">
                <h2 class="h5 mb-0"
                    th:text="#{msg.region-detail.section.regionData}">
                    Datos de la Comunidad Autónoma
                </h2>
            </div>

            <div class="card-body">
                <table class="table table-bordered">
                    <tbody>
                    <tr>
                        <th th:text="#{msg.region-detail.field.id}">ID</th>
                        <td th:text="${region.id}"></td>
                    </tr>
                    <tr>
                        <th th:text="#{msg.region-detail.field.code}">
                            Código
                        </th>
                        <td th:text="${region.code}"></td>
                    </tr>
                    <tr>
                        <th th:text="#{msg.region-detail.field.name}">
                            Nombre
                        </th>
                        <td th:text="${region.name}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Provincias asociadas a la región -->
        <div class="card mb-4">
            <div class="card-header">
                <h2 class="h5 mb-0"
                    th:text="#{msg.region-detail.section.provinces}">
                    Provincias
                </h2>
            </div>

            <div class="card-body">

                <!-- Mensaje si no existen provincias -->
                <div th:if="${#lists.isEmpty(region.provinces)}"
                     class="alert alert-info"
                     th:text="#{msg.region-detail.provinces.empty}">
                    Esta Comunidad Autónoma no tiene provincias registradas.
                </div>

                <!-- Tabla de provincias -->
                <div th:unless="${#lists.isEmpty(region.provinces)}"
                     class="table-responsive">

                    <table class="table table-striped table-bordered">
                        <thead>
                        <tr>
                            <th th:text="#{msg.region-detail.provinces.col.id}">
                                ID
                            </th>
                            <th th:text="#{msg.region-detail.provinces.col.code}">
                                Código
                            </th>
                            <th th:text="#{msg.region-detail.provinces.col.name}">
                                Nombre
                            </th>
                            <th th:text="#{msg.region-detail.provinces.col.actions}">
                                Acciones
                            </th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="province : ${region.provinces}">
                            <td th:text="${province.id}"></td>
                            <td th:text="${province.code}"></td>
                            <td th:text="${province.name}"></td>

                            <td>
                                <!-- Ver detalle de la provincia -->
                                <a th:href="@{/provinces/detail(id=${province.id})}"
                                   class="btn btn-outline-secondary btn-sm"
                                   th:text="#{msg.region-detail.viewDetail}">
                                    Ver Detalle
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Volver al listado de regiones -->
        <a th:href="@{/regions}"
           class="btn btn-secondary"
           th:text="#{msg.region-detail.action.back}">
            Volver al listado
        </a>

    </div>
</main>

<!-- Pie de página -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- JavaScript -->
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
